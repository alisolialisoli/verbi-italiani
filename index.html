<style>
/* Layout: one narrow column, content on top, fixed tab bar below; sessions take over the whole screen. */
:root{--bg:#f2f5f7;--card:#ffffff;--ink:#14212b;--mute:#586a77;--line:#d5dee4;--acc:#0a6a96;--accT:#ffffff;--soft:#dcebf3;--good:#23704a;--goodBg:#dff1e7;--bad:#ac3a2a;--badBg:#f8e3df;--warn:#8e5a00;
--fd:"Newsreader",Georgia,"Times New Roman",serif;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c161d;--card:#132029;--ink:#e5eef3;--mute:#8fa3b0;--line:#243642;--acc:#58b4dc;--accT:#06202d;--soft:#173443;--good:#6cc79a;--goodBg:#14352a;--bad:#ee8a78;--badBg:#3b1d19;--warn:#e0b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c161d;--card:#132029;--ink:#e5eef3;--mute:#8fa3b0;--line:#243642;--acc:#58b4dc;--accT:#06202d;--soft:#173443;--good:#6cc79a;--goodBg:#14352a;--bad:#ee8a78;--badBg:#3b1d19;--warn:#e0b04a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--fb);padding-inline:16px;padding-block:14px 96px;min-height:100vh}
#app{max-width:560px;margin:0 auto;display:grid;gap:14px;min-width:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1{font:600 28px/1.1 var(--fd);margin:4px 0 0}
h2{font:600 15px/1.2 var(--fb);margin:0 0 8px;color:var(--mute)}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:99px;font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.primary{background:var(--acc);color:var(--accT);border:0;border-radius:12px;padding:14px 18px;font-weight:600;min-height:50px;width:100%}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:46px}
.ib{background:none;border:0;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--mute);flex:none}
.ib svg{width:20px;height:20px;fill:currentColor}
.ib[aria-pressed="true"]{color:var(--warn)}
.no-tts .say{display:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{font:600 32px/1.15 var(--fd);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font:600 26px/1.1 var(--fd);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:99px}
.bar i.s{background:var(--acc);opacity:.35}
.lvl{display:grid;gap:5px;margin-bottom:12px}
.lvl:last-child{margin-bottom:0}
.lvl div:first-child{display:flex;justify-content:space-between;font-size:15px;font-variant-numeric:tabular-nums}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#tabs div{max-width:560px;margin:0 auto;display:flex}
#tabs button{flex:1;background:none;border:0;padding:12px 4px;font-size:15px;color:var(--mute);border-radius:10px;min-height:48px}
#tabs button[aria-current="true"]{color:var(--acc);font-weight:600;background:var(--soft)}
.v{background:var(--card);border:1px solid var(--line);border-radius:14px;min-width:0}
.vrow{display:flex;align-items:center;gap:2px;padding-right:4px}
.vt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:12px 14px;display:grid;gap:2px}
.inf{font:600 22px/1.2 var(--fd);overflow-wrap:anywhere}
.en{color:var(--mute);font-size:14px}
.tag{display:inline-block;background:var(--soft);border-radius:7px;padding:2px 8px;font-size:12.5px;margin-right:4px}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots u{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots u.on{background:var(--acc)}
.vb{padding:0 14px 14px;display:grid;gap:12px}
.forms{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 10px;font-size:16px}
.forms i{font-style:normal;color:var(--mute);font-size:13px;align-self:center}
.forms b{font-weight:600;overflow-wrap:anywhere}
details{border-top:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:600;padding:6px 0;min-height:36px}
.ex{display:flex;gap:4px;align-items:flex-start;padding:4px 0}
.ex>div{flex:1;min-width:0}
.ex b{font-weight:500}
.ex em{display:block;color:var(--mute);font-size:14px;font-style:normal}
.ex .pn{color:var(--mute);font-size:12.5px;margin-right:4px}
input[type=search],input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
textarea{min-height:90px;font-size:13px}
.sbar{display:flex;align-items:center;gap:10px}
.sbar .bar{flex:1}
.qc{text-align:center;display:grid;gap:12px;padding:22px 16px}
.qt{justify-self:center;background:var(--soft);border-radius:99px;padding:3px 12px;font-size:13px}
.prompt{font:600 30px/1.2 var(--fd);overflow-wrap:anywhere}
.prompt.cl{font-size:24px;line-height:1.35}
.blank{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--acc);margin-inline:3px}
.qc input{text-align:center;font-size:20px}
.acc{display:flex;gap:6px;justify-content:center}
.acc button{flex:1;max-width:52px;border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:44px;font-size:18px}
.fb{border-radius:12px;padding:12px 14px;display:grid;gap:4px;text-align:left}
.fb.ok{background:var(--goodBg);color:var(--good)}
.fb.ko{background:var(--badBg);color:var(--bad)}
.fb .exp{color:var(--ink);font-weight:600;font-size:18px}
.fb small{color:var(--ink);opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auxb{font:600 26px/1 var(--fd);border:2px solid var(--line);background:var(--card);border-radius:14px;padding:22px 8px;min-height:72px}
.hl{padding:10px 0;border-top:1px solid var(--line)}
.hl:first-child{border-top:0}
.hl button.n{background:none;border:0;padding:0;text-align:left;width:100%;display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.fa{direction:rtl;text-align:right;font-family:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.8}
.fa b,.fa i{unicode-bidi:isolate}
.fa ul{margin:6px 0;padding-inline-start:20px}
.fa li{margin:3px 0}
.fa i{font-style:normal;background:var(--soft);border-radius:6px;padding:0 5px}
.sess{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px)}
.sess .main{flex:1;display:grid;gap:14px;align-content:start}
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;background:var(--bg);padding:8px 0 2px;margin-top:auto}
body.insess{padding-block:14px 14px}
.dock .primary,.dock .ghost{min-height:56px;font-size:17px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;min-height:56px;font-size:17px;overflow-wrap:anywhere}
.opt:disabled{opacity:1}
.bars{display:flex;gap:6px;height:130px;align-items:stretch}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bcol b{font-size:12px;font-weight:600;min-height:15px;font-variant-numeric:tabular-nums}
.bt{flex:1;width:100%;display:flex;flex-direction:column-reverse;justify-content:flex-start}
.bt i{display:block;width:100%;background:var(--acc)}
.bt i.w{background:var(--bad)}
.bcol span{font-size:12px;color:var(--mute)}
.big-say{width:84px;height:84px;border-radius:50%;background:var(--soft);justify-self:center;color:var(--acc)}
.big-say svg{width:40px;height:40px}
.tg summary{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px}
.tg details{border:0}
.tbl{display:grid;gap:0}
.tbl div{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.tbl div:first-child{border-top:0}
.sync{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

    else if (q.type === "dict") { p = `<button class="ib big-say say" data-act="say" data-t="${esc(q.say)}" aria-label="Ascolta">${SVG_SPK}</button><div class="sub">Ascolta e scrivi la forma verbale che senti.</div>`; }
    else if (q.type === "tr") { p = `<div class="prompt">${esc(q.prompt)}</div><div class="sub">${q.len} lettere · scrivi il verbo all'infinito</div>`; }
    else if (q.type === "pp") { p = `<div class="prompt">${esc(d[1])} →</div><div class="sub">scrivi il participio passato</div>`; }
    else { p = `<div class="prompt">${esc(q.prompt)} →</div>`; }
    body = `<section class="card qc"><span class="qt">${label}</span>${p}</section>`;
    if (!a) dock = `<form id="fm" class="dock"><input type="text" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Risposta"><div class="acc">${"àèéìòù".split("").map(c => `<button type="button" data-act="acc" data-c="${c}">${c}</button>`).join("")}</div><button class="primary" type="submit">Controlla</button></form>`;
    else { body += fbHTML(q, a); }
  }
  if (a && !dock.includes('id="nx"') && q.type !== "card" && q.type !== "aud") dock = `<div class="dock two">${!a.ok && !q.practice ? '<button class="ghost" data-act="override">Era giusto</button>' : "<span></span>"}<button class="primary" id="nx" data-act="next">Avanti</button></div>`;
  return `<div class="sess"><div class="main">${top}${body}</div>${dock}</div>`;
}
function fbHTML(q, a) {
  const sayT = q.type === "cloze" ? q.full : q.type === "tr" ? q.show : (q.type === "conj" || q.type === "dict") ? q.say : q.type === "conf" ? q.full : q.type === "tense" ? q.say : q.show;
  const shown = q.type === "cloze" ? q.full : q.type === "conf" ? q.full : q.show;
  let extra = "";
  if (q.type === "cloze") extra = `<small>${esc(q.en)}</small>`;
  if (q.type === "dict") extra = `<small>${esc(q.prompt)} · ${esc(TN[q.tense])}</small>`;
  if (q.type === "tense") extra = `<small class="fa">${esc(SHORT[q.ans] || "")}</small>`;
  if (q.type === "conf") extra = `<small class="fa">${q.why}</small>`;
  if (q.type === "conj" && q.tense !== "pre") extra = `<small class="fa">${esc(TN[q.tense])}: ${esc(SHORT[q.tense] || "")}</small>`;
  return `<div class="fb ${a.ok ? "ok" : "ko"}"><b>${a.ok ? (a.override ? "Giusto, corretto" : "Giusto") : "Sbagliato"}</b>${a.given && q.type !== "tense" && q.type !== "conf" ? `<small>Tua risposta: ${esc(a.given)}</small>` : ""}<div>${q.type === "tense" ? "Tempo: " : "Risposta: "}<span class="exp">${esc(shown)}</span> ${(q.type === "aux" ? "" : spk(sayT))}</div>${extra}${q.also && q.also.length && q.type === "tr" ? `<small>Va bene anche: ${esc(q.also.join(", "))}</small>` : ""}${a.accent ? "<small>Attenzione agli accenti.</small>" : ""}</div>`;
}
function afterSession() {
  if (!SS || SS.done) return;
  const q = SS.q;
  const i = $("#ans"); if (i && !SS.ans) i.focus();
  const nx = $("#nx"); if (nx) nx.focus();
  if (q && !SS.ans && (q.type === "dict" || q.type === "aud") && SS.sp !== SS.i + ":" + q.type + ":" + SS.items.length) { SS.sp = SS.i + ":" + q.type + ":" + SS.items.length; speak(q.say); }
}

// ----- render -----
function render() {
  $("#tabs").hidden = !!SS;
  document.body.classList.toggle("insess", !!SS);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", String(b.dataset.v === view)));
  $("#app").innerHTML = SS ? sessionHTML() : ({ today: viewToday, study: viewStudy, practice: viewPractice, tempi: viewTempi, stats: viewStats }[view])();
  if (!SS && view === "study") renderList();
  afterSession();
}
const go = v => { view = v; resetArm = 0; render(); window.scrollTo(0, 0); };

const ACT = {
  tab: b => go(b.dataset.v),
  goal: b => { store.goal = +b.dataset.n; save(); render(); },
  "today-start": () => {
    const list = buildSession(store.rec, ALL, store.goal, Date.now());
    startSession(list, "mix");
  },
  "pf-src": b => { store.pref.src = b.dataset.v; save(); render(); },
  "pf-lv": b => { const l = b.dataset.v, p = store.pref; p.lv = p.lv.includes(l) ? p.lv.filter(x => x !== l) : p.lv.concat(l); if (!p.lv.length) p.lv = [l]; save(); render(); },
  "pf-mode": b => { store.pref.mode = b.dataset.v; save(); render(); },
  "pf-tlv": b => { store.pref.tlv = b.dataset.v; save(); render(); },
  "pf-tense": b => { store.pref.tense = b.dataset.v; save(); render(); },
  "pf-size": b => { store.pref.size = +b.dataset.v; save(); render(); },
  "pf-start": () => {
    const p = store.pref, pool = poolFor({ lv: p.lv, src: p.mode === "conf" ? "conf" : p.src });
    if (pool.length) startSession(buildSession(store.rec, pool, p.size, Date.now()), p.mode);
  },
  "tm-model": b => { tModel = b.dataset.v; const open = [...document.querySelectorAll(".tg[open]")].map(x => x.querySelector("summary b").textContent); render(); document.querySelectorAll(".tg").forEach(x => { if (open.includes(x.querySelector("summary b").textContent)) x.open = true; }); },
  "tg-practice": b => { const list = buildSession(store.rec, ALL.filter(k => { const c = conj(D[k]); return !IMPOSS.has(D[k][1]) && tensePool(c, null, b.dataset.v)[0] === b.dataset.v; }), 15, Date.now()); if (list.length) startSession(list, "conj", b.dataset.v); },
  "st-lv": b => { const l = b.dataset.v; sf.lv = sf.lv.includes(l) ? sf.lv.filter(x => x !== l) : sf.lv.concat(l); render(); },
  "st-flag": b => { sf[b.dataset.v] = sf[b.dataset.v] ? 0 : 1; render(); },
  tgl: b => {
    const k = +b.dataset.k, art = b.closest(".v"), vb = art.querySelector(".vb");
    if (openSet.has(k)) { openSet.delete(k); vb.hidden = true; vb.innerHTML = ""; }
    else { openSet.add(k); vb.innerHTML = detail(k); vb.hidden = false; }
    b.setAttribute("aria-expanded", String(openSet.has(k)));
  },
  fav: b => {
    const k = +b.dataset.k, r = recOf(k); r.fav = r.fav ? 0 : 1; save();
    b.setAttribute("aria-pressed", String(!!r.fav));
    if (sf.fav && !r.fav) renderList();
  },
  say: b => speak(b.dataset.t),
  goto: b => { sf.q = D[+b.dataset.k][1]; sf.lv = []; sf.irr = sf.fav = sf.hard = 0; openSet.add(+b.dataset.k); go("study"); },
  close: () => { SS = null; try { speechSynthesis.cancel(); } catch (e) { } render(); window.scrollTo(0, 0); },
  again: () => {
    const mode = SS.mode, p = store.pref, t = SS.tense;
    const pool = mode === "conf" ? CFALL : (view === "practice" || view === "tempi") ? poolFor({ lv: p.lv, src: p.src }) : ALL;
    startSession(buildSession(store.rec, pool, view === "today" ? store.goal : p.size, Date.now()), mode, t);
  },
  flip: () => { SS.flip = true; render(); },
  "g-ok": () => answered(true, "", true),
  "g-ko": () => answered(false, "", true),
  aux: b => { const v = b.dataset.v; answered(v === SS.q.ans, v); },
  opt: b => { if (SS.ans) return; const v = b.dataset.v; answered(v === SS.q.ans, v); },
  acc: b => { const i = $("#ans"); if (!i) return; i.setRangeText(b.dataset.c, i.selectionStart, i.selectionEnd, "end"); i.focus(); },
  next: () => { if (SS.ans) nextQ(); },
  override: () => {
    const q = SS.q, a = SS.ans; if (!a || a.ok || q.practice) return;
    const r = recOf(q.k); Object.assign(r, JSON.parse(SS.snap)); grade(r, true, q.type, Date.now());
    const l = store.log[dk()]; if (l) l.ok++;
    const last = SS.res[SS.res.length - 1]; if (last) last.ok = true;
    SS.ans = { ok: true, given: a.given, override: true }; save(); render();
  },
  "bk-file": () => {
    const txt = JSON.stringify(store), name = "verbi-italiani-" + new Date().toISOString().slice(0, 10) + ".json";
    const say = m => { bkMsg = m; const e = $("#bkm"); if (e) e.textContent = m; };
    try {
      const url = URL.createObjectURL(new Blob([txt], { type: "application/json" })), a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      setLB(); say("Copia scaricata: " + name); if (view === "today") render();
    } catch (e) { say("Il download non è disponibile qui: usa il testo da copiare."); }
  },
  "bk-pick": () => { const f = $("#bkf"); if (f) f.click(); },
  "bk-copy": () => {
    const t = $("#bk"); t.value = JSON.stringify(store); t.select();
    const done = m => { bkMsg = m; const e = $("#bkm"); if (e) e.textContent = m; };
    try { navigator.clipboard.writeText(t.value).then(() => done("Copiato."), () => done("Seleziona il testo e copialo a mano.")); } catch (e) { done("Seleziona il testo e copialo a mano."); }
  },
  "bk-import": () => {
    const e = $("#bkm");
    try {
      const j = JSON.parse($("#bk").value);
      if (!j || typeof j.rec !== "object") throw 0;
      adopt(j); save(); setLB(); bkMsg = "Progressi importati."; render();
    } catch (x) { e.textContent = "Il testo non è una copia valida."; }
  },
  reset: () => {
    if (!resetArm) { resetArm = 1; render(); return; }
    const g = store.goal, pf = store.pref; store = fresh(); store.goal = g; store.pref = pf; resetArm = 0; bkMsg = "Progressi azzerati."; save(); render();
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "fm") return;
  e.preventDefault();
  if (!SS || SS.ans) return;
  const v = $("#ans").value;
  if (!v.trim()) return;
  const r = check(SS.q, v);
  answered(r.ok, v.trim());
  if (SS.ans) SS.ans.accent = r.accent;
  render();
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { sf.q = e.target.value; renderList(); }
});
document.addEventListener("change", e => {
  if (e.target.id !== "bkf" || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try { const j = JSON.parse(r.result); if (!j || typeof j.rec !== "object") throw 0; adopt(j); save(); setLB(); bkMsg = "Progressi ripristinati dal file."; }
    catch (x) { bkMsg = "Il file non è una copia valida."; }
    render();
  };
  r.onerror = () => { bkMsg = "Impossibile leggere il file."; render(); };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.repeat && SS && SS.ans && !SS.done && !e.target.closest("button")) { e.preventDefault(); nextQ(); }
});
render();

</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () { }); });
}
</script>
